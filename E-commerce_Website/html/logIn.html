<!DOCTYPE html>
<html>
    <head>
        <title>Page de connexion</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <link rel="stylesheet" href="../style/signUp.css">
        <link rel="stylesheet" href="../style/logIn.css">
        <link rel="stylesheet" href="../style/all.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    </head>
    <body>
        <div class="headPage">
            <p class="headPage-description">Summer Sale For All Swim Suits And Free Express Delivery - 0FF50%!<a href="" class="shopLink">   ShopNow</a></p>
            <p class="languageChoice">English <i class="fa-solid fa-chevron-down"></i></p>
        </div>
        <header>
            <p class="exclusive">Exclusive</p>
            <nav>
                <ul class="linkOptions">
                    <li class="navLink" id="homeLink">Home</li>
                    <li class="navLink">Contact</li>
                    <li class="navLink">About</li>
                    <li class="navLink">Sign Up</li>
                </ul>
            </nav>
            <div class="search-bar">
                <p class="default">What are you looking for?</p>
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
        </header>
        <div class="signUp-section">
            <div class="signUp-image">
                <img src="../../Step2/images/14640.jpg" alt="">
            </div>
            <div class="signUp-form">
                <div class="form-header">
                    <h1 class="signUp-title">Log in to Exclusive</h1>
                    <p class="enter">Enter your details below</p>
                </div>
                <form action="">
                    <label for="email-or-phone-number">Email or phone number</label><br>
                    <input type="text" id="email-or-phone-number" name="email-or-phone-number"><br>
                    <label for="password">password</label><br>
                    <input type="password" id="password" name="password"><br>
                    <div class="logIn-options">
                        <button class="logIn">Log In</button>
                        <a href="" class="forgot-password-link">Forgot password ?</a>
                    </div>
                </form>
            </div>
        </div>
    </body>
</html>
